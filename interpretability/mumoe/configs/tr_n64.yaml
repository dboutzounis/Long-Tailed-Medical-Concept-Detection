# Generated by cnn/generate_configs.py from configs/base.yaml. head=trmumoe n_experts=64 loss=asl
paths:
  train_shards: $WORK/imageclefmed2026_webdataset/train-shards-{000000..000091}.tar
  val_shards: $WORK/imageclefmed2026_webdataset/val-shards-{000000..000019}.tar
  test_shards: $WORK/imageclefmed2026_webdataset/test-shards-{000000..000007}.tar
  mlb: $WORK/Long-Tailed-Medical-Concept-Detection/artifacts/mlb.pkl
  pos_weight: $WORK/Long-Tailed-Medical-Concept-Detection/artifacts/pos_weight.pt
  descendant_matrix: $WORK/Long-Tailed-Medical-Concept-Detection/artifacts/umls_descendant_matrix.npz
  checkpoints: $WORK/Long-Tailed-Medical-Concept-Detection/runs/mumoe/tr_n64/checkpoints/
  logs: $WORK/Long-Tailed-Medical-Concept-Detection/runs/mumoe/tr_n64/logs/
data:
  num_classes: 2645
  image_size: 224
  batch_size: 64
  num_workers: 4
  prefetch_factor: 2
  train_shuffle_buffer: 5000
  augment: false
  aug_rotation_degrees: 7
  aug_brightness: 0.15
  aug_contrast: 0.15
model:
  backbone: efficientnet_v2_m
  pretrained: true
  pool_type: gem
  gem_p: 3.0
  dropout: 0.0
  head_type: trmumoe
  mumoe:
    n_experts: 64
    hierarchy: 1
    second_experts: null
    rank: 256
    r_expert: 4
    r_io: 128
    second_dim: 0
    normalization: bn
training:
  epochs: 50
  train_batches_per_epoch: 353
  local_dev_epochs: 2
  local_dev_max_train_batches: 50
  local_dev_max_val_batches: 20
  grad_accum_steps: 1
  max_grad_norm: 1.0
  optimizer: adamw
  lr_backbone: 0.0001
  lr_head: 0.0001
  weight_decay: 0.01
  scheduler_type: reduce_on_plateau
  plateau_factor: 0.5
  plateau_patience: 1
  warmup_epochs: 2
  min_lr: 1.0e-06
  threshold: 0.5
  early_stopping_patience: 5
  seed: 42
loss:
  type: asl
  asl:
    gamma_neg: 4
    gamma_pos: 0
    clip: 0.02
pos_weight:
  enabled: false
  min_clamp: 1.0
  max_clamp: 50.0
