# Single-model baseline (Section 4.1): EfficientNetV2-M, GeM pooling, linear head, BCE.
# Every other CNN config is generated from this file by generate_configs.py.
# $WORK is expanded when the config is loaded.
paths:
  train_shards: "$WORK/imageclefmed2026_webdataset/train-shards-{000000..000091}.tar"
  val_shards: "$WORK/imageclefmed2026_webdataset/val-shards-{000000..000019}.tar"
  test_shards: "$WORK/imageclefmed2026_webdataset/test-shards-{000000..000007}.tar"
  mlb: "$WORK/Long-Tailed-Medical-Concept-Detection/artifacts/mlb.pkl"
  pos_weight: "$WORK/Long-Tailed-Medical-Concept-Detection/artifacts/pos_weight.pt"
  descendant_matrix: "$WORK/Long-Tailed-Medical-Concept-Detection/artifacts/umls_descendant_matrix.npz"
  checkpoints: "$WORK/Long-Tailed-Medical-Concept-Detection/runs/cnn/baseline/checkpoints/"
  logs: "$WORK/Long-Tailed-Medical-Concept-Detection/runs/cnn/baseline/logs/"
data:
  num_classes: 2645
  image_size: 224
  batch_size: 64  # per GPU
  num_workers: 4
  prefetch_factor: 2
  train_shuffle_buffer: 5000
  augment: false  # no augmentation in the thesis
  aug_rotation_degrees: 7
  aug_brightness: 0.15
  aug_contrast: 0.15
model:
  backbone: "efficientnet_v2_m"  # any torchvision CNN, or a timm name (ConvNeXt V2)
  pretrained: true
  pool_type: "gem"  # gem | avg | max
  gem_p: 3.0
  dropout: 0.0
  head_type: "linear"  # linear | cpmumoe | trmumoe
  mumoe:
    n_experts: 64
    hierarchy: 1
    second_experts: null
    rank: 256  # CP rank
    r_expert: 4  # TR rank along the expert mode
    r_io: 128  # TR rank along the input/output modes
    second_dim: 0
    normalization: "bn"  # applied before the entmax gate
training:
  epochs: 50
  train_batches_per_epoch: 353  # ~one pass over the training set at batch 256
  local_dev_epochs: 2
  local_dev_max_train_batches: 50
  local_dev_max_val_batches: 20
  grad_accum_steps: 1
  max_grad_norm: 1.0
  optimizer: "adamw"
  lr_backbone: 1.0e-4
  lr_head: 1.0e-4
  weight_decay: 1.0e-2
  scheduler_type: "reduce_on_plateau"
  plateau_factor: 0.5
  plateau_patience: 1
  warmup_epochs: 2  # warmup_cosine only
  min_lr: 1.0e-6
  threshold: 0.50  # only for the F1 logged during training
  early_stopping_patience: 5
  seed: 42
loss:
  type: "bce"  # bce | asl | mcloss
  asl:
    gamma_neg: 4
    gamma_pos: 0
    clip: 0.02  # probability margin m
pos_weight:
  enabled: false
  min_clamp: 1.0
  max_clamp: 50.0
